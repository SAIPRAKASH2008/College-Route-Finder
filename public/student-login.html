<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student & Staff Sign In - College Bus Route Optimizer</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body data-portal="USER">
  <a href="#login-form" class="skip-to-content">Skip to login form</a>

  <div class="auth-container">
    <div class="card auth-card" data-portal="USER">
      <div class="login-heading">
        <div class="portal-icon" aria-hidden="true">
          🎓
        </div>
        <div class="portal-badge portal-badge-student">
          Student Portal • No 2FA Required
        </div>
        <h2 class="portal-heading">
          Student Transit Sign In
        </h2>
        <p class="portal-subtitle">
          Access bus routes, nearest stops & live travel times (No 2FA needed)
        </p>
      </div>

      <!-- Quick Switcher Banner -->
      <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(230, 224, 240, 0.06); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.6rem 0.85rem; margin-bottom: 1.25rem; font-size: 0.8rem;">
        <span style="color: var(--text-muted);">College Staff or Administrator?</span>
        <a href="/admin-login.html" class="portal-switch-link">
          👔 Staff & Admin Login (2FA) →
        </a>
      </div>

      <!-- Error / Alert Banner -->
      <div id="login-alert" class="alert alert-danger" style="display: none;" role="alert" aria-live="assertive"></div>

      <form id="login-form">
        <input type="hidden" id="portal-role" value="USER">

        <div class="form-group">
          <label class="form-label" for="login-email">Student College Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="student@college.edu" required autocomplete="email" aria-required="true">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password" aria-required="true">
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary btn-lg login-submit" aria-label="Sign In as Student">
          <span>🎓 Sign In as Student (No 2FA)</span>
        </button>
      </form>

      <div class="portal-footer">
        Don't have an account? <a href="/register.html">Register Student Account</a>
      </div>

      <div style="margin-top: 0.85rem; text-align: center; font-size: 0.75rem; color: var(--text-dim); display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;">
        <a href="/privacy-policy.html" style="color: var(--text-dim); text-decoration: none;">Privacy</a>
        <span>•</span>
        <a href="/terms.html" style="color: var(--text-dim); text-decoration: none;">Terms</a>
        <span>•</span>
        <a href="/cookie-policy.html" style="color: var(--text-dim); text-decoration: none;">Cookies</a>
        <span>•</span>
        <a href="/refund-policy.html" style="color: var(--text-dim); text-decoration: none;">Refunds</a>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
